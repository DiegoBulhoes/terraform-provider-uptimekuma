name: Tests
run-name: "Tests - ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      kuma22:
        description: "Uptime Kuma 2.2.1"
        type: boolean
        default: true
      kuma23:
        description: "Uptime Kuma 2.3.2"
        type: boolean
        default: true
      kuma24:
        description: "Uptime Kuma 2.4.0"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      kuma_versions: ${{ steps.build.outputs.versions }}
    steps:
      - name: Build acceptance matrix
        id: build
        env:
          KUMA22: ${{ github.event.inputs.kuma22 }}
          KUMA23: ${{ github.event.inputs.kuma23 }}
          KUMA24: ${{ github.event.inputs.kuma24 }}
        run: |
          set -euo pipefail
          # On pull_request these inputs are absent (empty), so the "!= false"
          # test keeps every version in the matrix without branching on the event.
          selected=()
          [ "$KUMA22" = "false" ] || selected+=(2.2.1)
          [ "$KUMA23" = "false" ] || selected+=(2.3.2)
          [ "$KUMA24" = "false" ] || selected+=(2.4.0)
          if [ ${#selected[@]} -eq 0 ]; then
            echo "::error::select at least one Uptime Kuma version"
            exit 1
          fi
          versions=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "### Acceptance matrix: Uptime Kuma ${selected[*]}" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)" || (echo "Run 'make fmt'" && exit 1)

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      # tfplugindocs exports the provider schema through Terraform. Without a
      # binary on PATH it downloads one via hc-install, which currently fails
      # PGP verification ("openpgp: key expired").
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate documentation
        run: go tool tfplugindocs validate --provider-name uptimekuma

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage-unit.out ./test/unit/...

  acceptance:
    name: Acceptance Tests (Uptime Kuma ${{ matrix.kuma_version }})
    runs-on: ubuntu-latest
    needs: [resolve-matrix, unit]
    strategy:
      fail-fast: false
      matrix:
        kuma_version: ${{ fromJSON(needs.resolve-matrix.outputs.kuma_versions) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          UPTIME_KUMA_IMAGE: "louislam/uptime-kuma:${{ matrix.kuma_version }}"
        # -p 1: each acceptance package starts its own Uptime Kuma container, and
        # running them concurrently starves the runner into timeouts.
        run: go test -p 1 -tags integration -timeout 900s -coverprofile=coverage.out -coverpkg=./internal/... ./test/integration/...

      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        if: matrix.kuma_version == '2.4.0'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: acceptance
          fail_ci_if_error: false
